name: Generate EVY transparent product PNGs
on:
  push:
    paths:
      - scripts/generate_cutouts.py
      - .github/workflows/generate-cutouts.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Create transparent product assets
        run: python scripts/generate_cutouts.py
      - name: Publish generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cutouts/
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate transparent EVY product PNGs"
            git push
          fi
